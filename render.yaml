services:
  - type: web
    name: multi-agent-orchestrator
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn orchestrator_backend:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --threads 8
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
